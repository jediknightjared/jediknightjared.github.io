<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A learning log for Jared Peterson's portfolio and software projects." />
    <link rel="stylesheet" type="text/css" href="/main.css" />
    <link id="page_favicon" href="/Images/Logo.ico" rel="icon" type="image/x-icon" />
    <title>Learning Log | Jared Peterson</title>
    <script src="/nav.js" defer></script>
    <script src="/learning-log.js" defer></script>
  </head>

  <body>
    <header id="nav" class="site-nav"></header>

    <main>
      <section class="page-hero section-shell">
        <p class="eyebrow">Learning log</p>
        <h1>What I am learning as I build.</h1>
        <p>
          A running place for project notes, technical discoveries, decisions, and ideas I want to come back to later.
        </p>
      </section>

      <section id="learningLogEntries" class="section-shell log-list" aria-label="Learning log entries">
        <p class="log-status">Loading learning log entries...</p>
      </section>

      <section class="section-shell goals-section" aria-labelledby="goals-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Goals</p>
            <h2 id="goals-heading">What I am working toward.</h2>
          </div>
        </div>
        <div id="learningGoals" class="goals-grid">
          <p class="log-status">Loading goals...</p>
        </div>
      </section>
    </main>
  </body>
</html>
